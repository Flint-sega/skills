name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Синтаксис Python
        run: python -m py_compile tools/*.py skills/foreman/tools/ap.py tests/*.py
      - name: Frontmatter SKILL.md
        run: |
          pip install -q pyyaml
          python tools/check_frontmatter.py
      - name: Тесты ap.py
        run: python -m unittest discover -s tests -v
      - name: JS дашборда разбирается
        run: |
          node -e "
          const fs=require('fs');
          const html=fs.readFileSync('skills/foreman/phases/dashboard-template.html','utf8');
          new Function(html.match(/<script>([\s\S]*?)<\/script>/g).map(s=>s.replace(/<\/?script>/g,'')).join('\n'));
          console.log('template JS: parses');"
      - name: Скан секретов
        run: python tools/scan_secrets.py
